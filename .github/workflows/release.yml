name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Zip WebContent
        run: |
          cd WebContent
          zip -r "../RuleOfThirds-${{ github.ref_name }}.zip" .
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RuleOfThirds-${{ github.ref_name }}.zip
            RELEASE.txt
