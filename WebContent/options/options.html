<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Rule of Thirds Options</title>
    </head>
    <body>
        <h1>Rule of Thirds Options</h1>

        <div>
            <h3>Grid</h3>
            <input type="radio" id="render-grid-enabled" name="render-grid" value="enabled">
            <label for="render-grid-enabled">Enabled</label><br>
            <input type="radio" id="render-grid-disabled" name="render-grid" value="disabled">
            <label for="render-grid-disabled">Disabled</label><br>
        </div>

        <div>
            <h3>Grid Colour</h3>
            <input type="radio" id="line-colour-black" name="line-colour" value="#000">
            <label for="line-colour-black">Black</label><br>
            <input type="radio" id="line-colour-white" name="line-colour" value="#fff">
            <label for="line-colour-white">White</label><br>
            <input type="radio" id="line-colour-red" name="line-colour" value="#f00">
            <label for="line-colour-red">Red</label><br>
            <input type="radio" id="line-colour-yellow" name="line-colour" value="#ff0">
            <label for="line-colour-yellow">Yellow</label><br>
            <input type="radio" id="line-colour-green" name="line-colour" value="#0f0">
            <label for="line-colour-green">Green</label><br>
            <input type="radio" id="line-colour-blue" name="line-colour" value="#00f">
            <label for="line-colour-blue">Blue</label><br>
            <input type="radio" id="line-colour-magenta" name="line-colour" value="#f0f">
            <label for="line-colour-magenta">Magenta</label><br>
            <input type="radio" id="line-colour-cyan" name="line-colour" value="#0ff">
            <label for="line-colour-cyan">Cyan</label><br>
        </div>

        <div>
            <h3>Intersection Circles</h3>
            <input type="radio" id="render-circle-enabled" name="render-circle" value="enabled">
            <label for="render-circle-enabled">Enabled</label><br>
            <input type="radio" id="render-circle-disabled" name="render-circle" value="disabled">
            <label for="render-circle-disabled">Disabled</label><br>
        </div>

        <div>
            <h3>Circles Style</h3>
            <input type="radio" id="circle-colour-black" name="circle-colour" value="#000">
            <label for="circle-colour-black">Black</label><br>
            <input type="radio" id="circle-colour-white" name="circle-colour" value="#fff">
            <label for="circle-colour-white">White</label><br>
            <input type="radio" id="circle-colour-red" name="circle-colour" value="#f00">
            <label for="circle-colour-red">Red</label><br>
            <input type="radio" id="circle-colour-yellow" name="circle-colour" value="#ff0">
            <label for="circle-colour-yellow">Yellow</label><br>
            <input type="radio" id="circle-colour-green" name="circle-colour" value="#0f0">
            <label for="circle-colour-green">Green</label><br>
            <input type="radio" id="circle-colour-blue" name="circle-colour" value="#00f">
            <label for="circle-colour-blue">Blue</label><br>
            <input type="radio" id="circle-colour-magenta" name="circle-colour" value="#f0f">
            <label for="circle-colour-magenta">Magenta</label><br>
            <input type="radio" id="circle-colour-cyan" name="circle-colour" value="#0ff">
            <label for="circle-colour-cyan">Cyan</label><br>
            <label for="circle-radius">Radius</label>
            <input type="number" id="circle-radius" step="5"  min="5" />
        </div>

        <div>
            <h3>Overlay Style</h3>
            <input type="radio" id="overlay-style-grid" name="overlay-style" value="grid">
            <label for="overlay-style-grid">Grid</label><br>
            <label for="grid-rows">Rows</label>
            <input type="number" id="grid-rows" min="2" /><br>
            <label for="grid-columns">Columns</label>
            <input type="number" id="grid-columns" min="2" />
        </div>

        <br />
        <button id="save">Save</button>
        <button id="restoreDefaults">Restore Defaults</button>

        <div id="status"></div>

        <script src="options.js"></script>
    </body>
</html>
