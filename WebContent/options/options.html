<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Rule of Thirds: Options</title>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col s12">
          <h2>Rule of Thirds: Options</h2>
        </div>
      </div>

      <div class="row">
        <div class="col s12">
          <h5>Line Colour</h5>
          <div class="divider"></div>
        </div>
        <div class="col s12 m5">
          <p>
            <label for="line-colour">Colour</label>
            <span class="colour-row">
              <input type="color" id="line-colour" value="#ffffff"/>
              <span class="quick-swatch-group" id="line-colour-quick" data-for="line-colour">
                <button type="button" class="quick-swatch" data-value="#000000" style="--swatch-colour:#000000" aria-label="Black"></button>
                <button type="button" class="quick-swatch" data-value="#ffffff" style="--swatch-colour:#ffffff" aria-label="White"></button>
                <button type="button" class="quick-swatch" data-value="#ff0000" style="--swatch-colour:#ff0000" aria-label="Red"></button>
                <button type="button" class="quick-swatch" data-value="#ffff00" style="--swatch-colour:#ffff00" aria-label="Yellow"></button>
                <button type="button" class="quick-swatch" data-value="#00ff00" style="--swatch-colour:#00ff00" aria-label="Green"></button>
                <button type="button" class="quick-swatch" data-value="#0000ff" style="--swatch-colour:#0000ff" aria-label="Blue"></button>
                <button type="button" class="quick-swatch" data-value="#ff00ff" style="--swatch-colour:#ff00ff" aria-label="Magenta"></button>
                <button type="button" class="quick-swatch" data-value="#00ffff" style="--swatch-colour:#00ffff" aria-label="Cyan"></button>
              </span>
            </span>
          </p>
          <p>
            <label for="line-opacity">Opacity</label>
            <span class="opacity-row">
              <input type="range" id="line-opacity" min="0" max="100"/>
              <span class="opacity-value" id="line-opacity-value"></span>
            </span>
          </p>
        </div>
      </div>

      <div class="row">
        <div class="col s12 m3">
          <div class="row">
            <div class="col s12">
              <h5>Grid</h5>
              <div class="divider"></div>
            </div>
            <div class="col s12">
              <p>
                <label>
                  <input type="checkbox" id="render-grid"/>
                  <span>Enabled</span>
                </label>
              </p>
              <p>
                <label for="grid-rows">Rows</label>
                <input type="number" id="grid-rows" min="1" max="9"/>
              </p>
              <p>
                <label for="grid-columns">Columns</label>
                <input type="number" id="grid-columns" min="1" max="9"/>
              </p>
            </div>
          </div>
        </div>
        <div class="col s12 m9">
          <div class="row">
            <div class="col s12">
              <h5>Circles</h5>
              <div class="divider"></div>
            </div>
            <div class="col s12">
              <p>
                <label>
                  <input type="checkbox" id="render-circle"/>
                  <span>Enabled</span>
                </label>
              </p>
            </div>
            <div class="col s12 m2">
              <p>
                <label for="circle-radius">Radius</label>
                <input type="number" id="circle-radius" min="1"/>
              </p>
              <p>
                <label>
                  <input type="radio" id="circle-style-outline" name="circle-style" value="outline">
                  <span>Outline</span>
                </label>
              </p>
              <p>
                <label>
                  <input type="radio" id="circle-style-filled" name="circle-style" value="filled">
                  <span>Filled</span>
                </label>
              </p>
            </div>
            <div class="col s12 m7 offset-m1">
              <p>
                <label for="circle-colour">Circle Colour</label>
                <span class="colour-row">
                  <input type="color" id="circle-colour" value="#ff0000"/>
                  <span class="quick-swatch-group" id="circle-colour-quick" data-for="circle-colour">
                    <button type="button" class="quick-swatch" data-value="#000000" style="--swatch-colour:#000000" aria-label="Black"></button>
                    <button type="button" class="quick-swatch" data-value="#ffffff" style="--swatch-colour:#ffffff" aria-label="White"></button>
                    <button type="button" class="quick-swatch" data-value="#ff0000" style="--swatch-colour:#ff0000" aria-label="Red"></button>
                    <button type="button" class="quick-swatch" data-value="#ffff00" style="--swatch-colour:#ffff00" aria-label="Yellow"></button>
                    <button type="button" class="quick-swatch" data-value="#00ff00" style="--swatch-colour:#00ff00" aria-label="Green"></button>
                    <button type="button" class="quick-swatch" data-value="#0000ff" style="--swatch-colour:#0000ff" aria-label="Blue"></button>
                    <button type="button" class="quick-swatch" data-value="#ff00ff" style="--swatch-colour:#ff00ff" aria-label="Magenta"></button>
                    <button type="button" class="quick-swatch" data-value="#00ffff" style="--swatch-colour:#00ffff" aria-label="Cyan"></button>
                  </span>
                </span>
              </p>
              <p>
                <label for="circle-opacity">Opacity</label>
                <span class="opacity-row">
                  <input type="range" id="circle-opacity" min="0" max="100"/>
                  <span class="opacity-value" id="circle-opacity-value"></span>
                </span>
              </p>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col s12">
          <h5>Customise</h5>
          <div class="divider"></div>
        </div>
        <div class="col s12 grid-customise-col" id="grid-customise-col">
          <div class="grid-customise-panel">
            <span class="field-caption">Hide / Show</span>
            <canvas class="grid-customise-control" id="grid-customise-control" width="360" height="240"></canvas>
          </div>
          <div class="grid-customise-panel">
            <span class="field-caption">Preview</span>
            <canvas class="grid-customise-preview" id="grid-customise-preview" width="360" height="240"></canvas>
            <p class="grid-customise-photo-toggle">
              <label>
                <input type="checkbox" id="preview-background-image"/>
                <span>Use background photo</span>
              </label>
            </p>
          </div>
        </div>
      </div>

      <br />

      <div class="row">
        <div class="col s12">
          <p class="right-align">
            <button id="restoreDefaults" class="btn-large">Restore Defaults</button>
          </p>
        </div>
      </div>
    </div>

    <script src="../grid-render.js"></script>
    <script src="options.js"></script>
  </body>
</html>
