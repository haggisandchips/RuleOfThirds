<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Rule of Thirds: Options</title>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col s12">
          <h2>Rule of Thirds: Options</h2>
        </div>
      </div>

      <div class="row">
        <div class="col s12">
          <h5>Grid</h5>
          <div class="divider"></div>
        </div>
        <div class="col s12 m3">
          <p>
            <label>
              <input type="radio" id="render-grid-enabled" name="render-grid" value="enabled">
              <span>Enabled</span>
            </label>
          </p>
          <p>
            <label>
              <input type="radio" id="render-grid-disabled" name="render-grid" value="disabled">
              <span>Disabled</span>
            </label>
          </p>
        </div>
        <div class="col s12 m2">
          <p>
            <label for="grid-rows">Rows</label>
            <input type="number" id="grid-rows" min="1"/>
          </p>
          <p>
            <label for="grid-columns">Columns</label>
            <input type="number" id="grid-columns" min="1"/>
          </p>
        </div>
        <div class="col s12 m3 offset-m1">
          <p>
            <label for="line-colour">Line Colour</label>
            <input type="color" id="line-colour" value="#ffffff"/>
          </p>
        </div>
      </div>

      <div class="row">
        <div class="col s12">
          <h5>Circles</h5>
          <div class="divider"></div>
        </div>
        <div class="col s12 m3">
          <p>
            <label>
              <input type="radio" id="render-circle-enabled" name="render-circle" value="enabled">
              <span>Enabled</span>
            </label>
          </p>
          <p>
            <label>
              <input type="radio" id="render-circle-disabled" name="render-circle" value="disabled">
              <span>Disabled</span>
            </label>
          </p>
        </div>
        <div class="col s12 m2">
          <p>
            <label for="circle-radius">Radius</label>
            <input type="number" id="circle-radius" min="1"/>
          </p>
          <p>
            <label>
              <input type="radio" id="circle-style-outline" name="circle-style" value="outline">
              <span>Outline</span>
            </label>
          </p>
          <p>
            <label>
              <input type="radio" id="circle-style-filled" name="circle-style" value="filled">
              <span>Filled</span>
            </label>
          </p>
        </div>
        <div class="col s12 m3 offset-m1">
          <p>
            <label for="circle-colour">Circle Colour</label>
            <input type="color" id="circle-colour" value="#ff0000"/>
          </p>
        </div>
      </div>

      <br />

      <div class="row">
        <div class="col s12">
          <p class="right-align">
            <button id="restoreDefaults" class="btn-large">Restore Defaults</button>
          </p>
        </div>
      </div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
